spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:books;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
